title: Listener.AI
description: Local-first meeting recorder with AI transcripts, summaries, and action items.
theme: jekyll-theme-minimal
show_downloads: false
# `pretty` permalinks produce extension-less URLs (e.g. /privacy/ instead
# of /privacy.html). Cleaner for legal pages we paste into the Google
# OAuth consent screen and reference from the app.
permalink: pretty
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

# Strip "edit on GitHub" footer that the minimal theme adds. The pages are
# legal docs, not project documentation -- a contributor-style edit link is
# misleading on a published privacy policy.
include:
  - privacy.md
  - terms.md
exclude:
  - vendor/
  - landing-maintenance.md
  - transcription-pipeline.md
  - model-landscape-2026-09.md
  - soniox-adoption-plan.md
  - transcription-job-reload-completion.md
  - electron-test-reuse.md
  - chatgpt-integration.md
  - model-pricing.md
  - RELEASE.md
  - README.md
