name: Build and Release

# One manual run on main releases the version that main already carries.
# The version bump reaches main through an ordinary pull request first
# (docs/RELEASE.md), so github.sha of this run is the source commit for every
# channel: the builds, the tag, the GitHub release, and npm provenance (which
# records GITHUB_SHA and GITHUB_REF). The run never creates commits.
#
# The tag is the only reservation. It is created at the source commit after
# the builds succeed and before either channel publishes, and a run for a
# version whose tag exists stops in preflight. Tags are never deleted or moved.

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, whichever ref it was started on.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Start a release from main (got $REF)."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify source commit and version
        id: verify
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"

          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$VERSION' is not X.Y.Z."
            exit 1
          fi

          # Only a confirmed absence passes; a lookup error stops the release.
          RC=0
          git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null || RC=$?
          case "$RC" in
            2) ;;
            0) echo "::error::Tag v$VERSION already exists. Merge a version bump to main first (docs/RELEASE.md)."; exit 1 ;;
            *) echo "::error::Could not look up tag v$VERSION (git ls-remote rc $RC)."; exit 1 ;;
          esac
          STATUS=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>/dev/null | head -n 1) || true
          if ! [[ "$STATUS" =~ ^HTTP/[0-9.]+\ 404 ]]; then
            echo "::error::GitHub release v$VERSION exists or could not be checked (${STATUS:-no response})."
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/listener-ai/$VERSION") || true
          if [ "$CODE" != 404 ]; then
            echo "::error::listener-ai@$VERSION exists on npm or could not be checked (HTTP ${CODE:-none})."
            exit 1
          fi

          {
            echo "sha=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION from $SHA"

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: mac
            cmd: electron-builder --mac --x64 --arm64 --publish never
          - os: windows-latest
            name: win
            cmd: electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Verify source commit
        shell: bash
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA" && test "$GITHUB_SHA" = "$SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build
          pnpm exec ${{ matrix.cmd }}
        env:
          CSC_LINK: ${{ matrix.name == 'mac' && secrets.SIGNING_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'mac' && secrets.CERT_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LISTENER_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.LISTENER_GOOGLE_OAUTH_CLIENT_ID }}
          LISTENER_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.LISTENER_GOOGLE_OAUTH_CLIENT_SECRET }}
          # Sentry DSN is baked into the desktop build by write-build-constants.js.
          # Safe to embed (send-only). Not passed to npm-publish -- the CLI ships
          # no Sentry code, so the DSN must not land in the published package.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}-build
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap

  # The tag is created before either channel publishes. Creating a ref fails
  # when it already exists, so the tag can only point at the source commit.
  tag:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag at the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.type + " " + .object.sha')
          if [ "$TAG" != "commit $SHA" ]; then
            echo "::error::Tag v$VERSION resolves to '$TAG', expected 'commit $SHA'."
            exit 1
          fi

  release:
    needs: [preflight, build, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Verify source commit
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA" && test "$GITHUB_SHA" = "$SHA"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      # The checkout already carries this release's tag (created by the tag
      # job), so it is excluded or the notes would cover an empty range.
      - name: Find previous tag
        id: prev_tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --exclude "v$VERSION" HEAD 2>/dev/null || echo "")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Generate AI release notes
        id: ai_notes
        uses: asleep-ai/actions/release-notes@release-notes/v1
        with:
          current-tag: HEAD
          previous-tag: ${{ steps.prev_tag.outputs.tag }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          system-prompt: |
            Generate bilingual release notes for the Electron desktop app (Listener.AI).
            Output markdown only — no preamble, no trailing explanation.
            Structure: English block first, then Korean block, separated by a horizontal rule.
            English block — header '## English' followed by sections
            '### New Features', '### Improvements', '### Bug Fixes', '### Internal Changes'.
            Korean block — header '## 한국어' followed by sections
            '### 신규 기능', '### 개선', '### 버그 수정', '### 내부 변경'.
            Omit empty sections in each block.
            Rewrite each commit as a user-facing bullet (not verbatim).
            The two blocks must describe the same changes — Korean is a translation of the English content,
            not independent notes.

      - name: Read release notes
        id: notes_body
        run: |
          {
            echo "content<<NOTES_EOF"
            cat "${{ steps.ai_notes.outputs.path }}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # release-action publishes on the existing tag, so check it still
      # points at the source commit.
      - name: Verify tag commit
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          git fetch --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          TAG_SHA=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::Tag v$VERSION points at $TAG_SHA, expected $SHA."
            exit 1
          fi

      # An existing release is never updated (allowUpdates stays off); see
      # docs/RELEASE.md for completing a partially uploaded release by hand.
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.preflight.outputs.version }}
          commit: ${{ needs.preflight.outputs.sha }}
          name: Release v${{ needs.preflight.outputs.version }}
          body: |
            ### Downloads
            - macOS (Intel): `Listener.AI-${{ needs.preflight.outputs.version }}-x64.dmg`
            - macOS (Apple Silicon): `Listener.AI-${{ needs.preflight.outputs.version }}-arm64.dmg`
            - Windows: `Listener.AI-Setup-${{ needs.preflight.outputs.version }}.exe`
            - CLI: `npx listener-ai <audio-file>`

            Installation: see the [README](https://github.com/asleep-ai/listener-ai#installation).

            ---

            ${{ steps.notes_body.outputs.content }}
          draft: false
          artifacts: |
            release-artifacts/mac-build/*.dmg
            release-artifacts/mac-build/*.zip
            release-artifacts/mac-build/*.yml
            release-artifacts/win-build/*.exe
            release-artifacts/win-build/*.yml
            release-artifacts/*/*.blockmap
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true

  npm-publish:
    needs: [preflight, build, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      # npm provenance records GITHUB_SHA and GITHUB_REF as the source, so the
      # run itself (not only the checkout) must be at the source commit on main.
      - name: Verify source commit
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install and publish
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm publish --provenance --access public
        env:
          LISTENER_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.LISTENER_GOOGLE_OAUTH_CLIENT_ID }}
          LISTENER_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.LISTENER_GOOGLE_OAUTH_CLIENT_SECRET }}
