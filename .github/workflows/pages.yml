name: Build and deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/fetch-landing-media.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/fetch-landing-media.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch and verify release media
        run: node scripts/fetch-landing-media.mjs
      - name: Build website and legal pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check published entry points
        run: |
          test -s _site/index.html
          test -s _site/privacy/index.html
          test -s _site/terms/index.html
          test -s _site/assets/demos/listener-demo.mp4
          test -s _site/assets/demos/listener-demo.jpg
          test -s _site/assets/demos/listener-demo.ko.vtt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
